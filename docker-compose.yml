version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: lifegrid-postgres
    environment:
      POSTGRES_DB: lifegrid
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: lifegrid-backend
    ports:
      - '8000:8000'
    env_file:
      - ./backend/.env.example
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: lifegrid-frontend
    ports:
      - '3000:3000'
    env_file:
      - ./frontend/.env.local
    depends_on:
      - backend

volumes:
  postgres_data:
